  <defs>
    <style>
      <![CDATA[
        .arena {
          fill: #0d1117;
        }
        .border {
          fill: none;
          stroke: #30363d;
          stroke-width: 1.5;
        }
        .title {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          font-size: 22px;
          font-weight: 600;
          fill: #e6edf3;
          text-anchor: middle;
        }
        .subtitle {
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          font-size: 11px;
          fill: #8b949e;
          text-anchor: middle;
        }
        .legend {
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          font-size: 11px;
          fill: #8b949e;
        }
        .qubit {
          fill: url(#qubitGrad);
          filter: drop-shadow(0 0 6px #58a6ff) drop-shadow(0 0 12px #1f6feb);
          animation: grover 32s linear infinite;
        }
        .measure-ring {
          fill: none;
          stroke: #ff7b72;
          stroke-width: 2.5;
          opacity: 0;
          animation: measure 32s linear infinite;
        }
        @keyframes grover {
          /* Row 0 Languages L→R */
          0%   { transform: translate(30px, 78px) scale(1); opacity: 1; }
          7%   { transform: translate(880px, 78px) scale(1); opacity: 1; }
          /* drop to row 1 */
          8%   { transform: translate(880px, 122px) scale(1); opacity: 1; }
          /* Row 1 Cloud R→L (GCP pass-through) */
          14%  { transform: translate(30px, 122px) scale(1); opacity: 1; }
          15%  { transform: translate(30px, 166px) scale(1); opacity: 1; }
          /* Row 2 Security L→R */
          24%  { transform: translate(880px, 166px) scale(1); opacity: 1; }
          25%  { transform: translate(880px, 210px) scale(1); opacity: 1; }
          /* Row 3 DFIR R→L */
          33%  { transform: translate(30px, 210px) scale(1); opacity: 1; }
          34%  { transform: translate(30px, 254px) scale(1); opacity: 1; }
          /* Row 4 Distros L→R */
          42%  { transform: translate(880px, 254px) scale(1); opacity: 1; }
          43%  { transform: translate(880px, 298px) scale(1); opacity: 1; }
          /* Row 5 Data/ML R→L (Matplotlib pass-through) */
          51%  { transform: translate(30px, 298px) scale(1); opacity: 1; }
          52%  { transform: translate(30px, 342px) scale(1); opacity: 1; }
          /* Row 6 DB/DevOps L→R */
          60%  { transform: translate(880px, 342px) scale(1); opacity: 1; }
          61%  { transform: translate(880px, 386px) scale(1); opacity: 1; }
          /* Row 7 AI R→L */
          67%  { transform: translate(30px, 386px) scale(1); opacity: 1; }
          68%  { transform: translate(30px, 430px) scale(1); opacity: 1; }
          /* Row 8 Docs L→R */
          73%  { transform: translate(880px, 430px) scale(1); opacity: 1; }
          74%  { transform: translate(880px, 474px) scale(1); opacity: 1; }
          /* Row 9 Frontend R→L (Streamlit pass-through) */
          88%  { transform: translate(30px, 474px) scale(1); opacity: 1; }
          /* Measurement collapse + teleport (Shor-inspired) */
          90%  { transform: translate(30px, 474px) scale(2.4); opacity: 0; }
          92%  { transform: translate(470px, 78px) scale(0.2); opacity: 0; }
          94%  { transform: translate(470px, 78px) scale(1.6); opacity: 1; }
          100% { transform: translate(30px, 78px) scale(1); opacity: 1; }
        }
        @keyframes measure {
          0%, 89%  { opacity: 0; transform: scale(0.4); }
          90%      { opacity: 1; transform: scale(1.8); }
          92%      { opacity: 0; transform: scale(2.6); }
          100%     { opacity: 0; transform: scale(0.4); }
        }
      ]]>
